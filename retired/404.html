<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Milwaukee Parking has moved to MKEstuff</title>
    <meta
      name="description"
      content="Milwaukee Parking is no longer updated. Check overnight parking, winter rules, and permits at MKEstuff.com/parking."
    />
    <!-- Search engines treat an immediate refresh plus a canonical link as a
         permanent move, the closest GitHub Pages allows to a 301. -->
    <link rel="canonical" href="https://mkestuff.com/parking/" />
    <meta http-equiv="refresh" content="0; url=https://mkestuff.com/parking/" />
    <script>
      location.replace('https://mkestuff.com/parking/');
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #142f3d;
        --muted: #4a5a63;
        --link: #00618a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111318;
          --text: #eef2f4;
          --muted: #b7c2c8;
          --link: #7cc8ec;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          17px/1.55 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
        padding: 15vh 16px 48px;
      }
      h1 {
        font-size: 1.6rem;
        line-height: 1.25;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1rem;
      }
      a {
        color: var(--link);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Milwaukee Parking has moved</h1>
      <p>
        This app is no longer updated. Check tonight’s side, your block’s
        overnight and winter rules, permits, and snow emergencies on MKEstuff
        instead.
      </p>
      <p>
        <a href="https://mkestuff.com/parking/">Go to MKEstuff parking</a>
      </p>
    </main>
  </body>
</html>
