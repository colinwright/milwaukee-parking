              "@type": "Answer",
              "text": "Park on the side whose house numbers match tonight’s date: odd date, odd side; even date, even side. What counts is tonight’s date, not tomorrow morning’s. So on July 10th you park on the even side, since 10 is even, and you’re fine there until 6 AM on the 11th."
