name: Refresh street data

# Re-fetches the city GIS layers monthly and commits the regenerated
# public/data/streets.json if it changed. A failed run keeps the last-good
# data (nothing is committed), so the site never breaks from an upstream hiccup.

on:
  schedule:
    - cron: '17 8 1 * *' # 08:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch + rebuild tagged data
        run: npm run data:all
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- public/data/streets.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/streets.json
            git commit -m "chore: monthly street data refresh"
            git push
          else
            echo "No change in street data."
          fi
