name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          # Repo project sites serve from /<repo-name>/. Derived automatically.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Live snow status is published to the `data` branch by snow.yml and
          # read cross-origin from raw.githubusercontent (CORS-open).
          VITE_SNOW_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/snow-status.json
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
