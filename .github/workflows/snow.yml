name: Snow emergency status

# Best-effort hourly scrape of the DPW snow-operations page during winter.
# Publishes snow-status.json to the `data` branch, which the app reads
# cross-origin (raw.githubusercontent). Writing to a separate branch means the
# hourly heartbeat never triggers a site rebuild.
#
# The job self-gates to Nov 15 - Mar 15; cron still fires year-round but the
# script exits early outside the window (GitHub disables schedules on inactive
# repos, so keep the repo active or trigger manually).

on:
  schedule:
    - cron: '5 * * * *' # top-ish of every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Seasonal gate (Nov 15 - Mar 15)
        id: gate
        run: |
          M=$(date -u +%m); D=$(date -u +%d)
          IN=0
          if [ "$M" = "12" ] || [ "$M" = "01" ] || [ "$M" = "02" ]; then IN=1; fi
          if [ "$M" = "11" ] && [ "$D" -ge 15 ]; then IN=1; fi
          if [ "$M" = "03" ] && [ "$D" -le 15 ]; then IN=1; fi
          echo "in_season=$IN" >> "$GITHUB_OUTPUT"
          echo "In season: $IN"

      - if: steps.gate.outputs.in_season == '1'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.in_season == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape
        if: steps.gate.outputs.in_season == '1'
        run: |
          npm i -D playwright@^1.47.0
          npx playwright install --with-deps chromium
          SNOW_OUT="$RUNNER_TEMP/snow-status.json" node scraper/snow.mjs
          cat "$RUNNER_TEMP/snow-status.json"

      - name: Publish to data branch
        if: steps.gate.outputs.in_season == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Prepare an orphan-ish data branch containing only snow-status.json.
          git fetch origin data --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "$RUNNER_TEMP/snow-status.json" snow-status.json
          git add snow-status.json
          git commit -m "chore: snow status $(date -u +%FT%TZ)" || echo "no change"
          git push origin data
